# Claude picks up an issue when someone with write access asks it to:
#   - add the `claude` label to an issue, or
#   - comment `@claude ...` on an issue or PR, or in a PR review.
# Bug reports follow the fix-bug skill, feature requests build-feature.
# Strangers can file issues on the public repo, but only collaborators can
# label, and comments are checked against author_association below, so nobody
# else can start a run. Claude opens a PR; merging it is still up to you.
#
# Needs the CLAUDE_CODE_OAUTH_TOKEN repo secret (set by /install-github-app).
name: Claude

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'claude') ||
      (github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name != 'issues' && github.event_name != 'pull_request_review' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    # Per job, not per workflow: a skipped run from an unrelated comment must
    # not displace a real one waiting in the queue.
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: claude
          additional_permissions: |
            actions: read
          claude_args: >-
            --max-turns 80
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(./build.sh),Bash(node tools/*),Bash(node build/*),Bash(cargo test *),Bash(git log *),Bash(git diff *),Bash(git status),Bash(gh issue view *),Bash(gh issue comment *),Bash(gh pr create *)"
