# Claude picks up a bug report when someone with write access asks it to:
#   - add the `claude-fix` label to an issue, or
#   - comment `@claude ...` on an issue or PR.
# Strangers can file issues on the public repo, but only collaborators can
# label, and comments are checked against author_association below, so nobody
# else can start a run. Claude opens a PR; merging it is still up to you.
#
# Needs one repo secret: CLAUDE_CODE_OAUTH_TOKEN (run `claude setup-token`) or
# ANTHROPIC_API_KEY. Running /install-github-app in Claude Code sets it up.
name: Claude bug fix

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'claude-fix') ||
      (github.event_name != 'issues' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          label_trigger: claude-fix
          claude_args: >-
            --max-turns 80
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(./build.sh),Bash(node tools/*),Bash(node build/*),Bash(cargo test *),Bash(git log *),Bash(git diff *),Bash(git status),Bash(gh issue view *),Bash(gh issue comment *),Bash(gh pr create *)"
