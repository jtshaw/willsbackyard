<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Will's Backyard</title>
<style>
  :root {
    --paper: #fdf6e6;
    --ink: #2e2822;
    --warm: #c8863a;
    --deep: #7a4a1e;
    --green: #3f8f3a;
    --red: #d94b3f;
    --shadow: 0 10px 0 rgba(0,0,0,.18), 0 18px 40px rgba(0,0,0,.35);
    --font: "Trebuchet MS", "Segoe UI", Avenir, -apple-system, system-ui, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #11151c; color: var(--ink);
    font-family: var(--font);
    user-select: none; -webkit-user-select: none;
  }
  #game { display: block; width: 100%; height: 100%; position: fixed; inset: 0; }

  /* ---------- HUD ---------- */
  #hud {
    position: fixed; inset: 0; pointer-events: none;
    padding: clamp(10px, 2vmin, 22px);
    display: flex; flex-direction: column; justify-content: space-between;
    transition: opacity .25s ease;
    font-size: clamp(12px, 1.5vmin, 17px);
  }
  #hud.dim { opacity: 0; }
  .hud-row { display: flex; align-items: flex-start; gap: clamp(8px, 1.4vmin, 16px); }
  .hud-row.bottom { align-items: flex-end; }
  .spacer { flex: 1; }

  .panel {
    background: linear-gradient(#fffdf4, var(--paper));
    border: 3px solid var(--ink);
    border-radius: 14px;
    box-shadow: 0 5px 0 rgba(0,0,0,.22), 0 10px 22px rgba(0,0,0,.3);
    padding: .5em .8em;
    display: flex; align-items: center; gap: .6em;
    line-height: 1;
  }
  .panel .lbl { font-size: .72em; letter-spacing: .09em; text-transform: uppercase; opacity: .62; font-weight: 700; }
  .panel b { font-size: 1.5em; font-weight: 800; letter-spacing: -.01em; }

  #hearts { display: flex; gap: .3em; }
  /* A glyph, not clip-path: path() -- that is unreliable on older WebKit. */
  #hearts i {
    display: block; font-style: normal; font-size: 1.5em; line-height: 1;
    color: var(--red); text-shadow: 0 2px 0 rgba(0,0,0,.25);
    transition: opacity .2s, filter .2s;
  }
  #hearts i.off { opacity: .22; filter: grayscale(1); }

  #loot.big { font-variant-numeric: tabular-nums; }
  .lootbox.done { border-color: var(--green); box-shadow: 0 5px 0 rgba(44,90,40,.4), 0 0 24px rgba(90,200,90,.6); }
  .lootbox.done .lbl { color: var(--green); opacity: 1; }

  #powerups { display: flex; gap: .3em; }
  .pw {
    width: 1.9em; height: 1.9em; border-radius: 50%;
    display: grid; place-items: center;
    font-style: normal; font-weight: 900; font-size: .95em;
    border: 3px solid var(--ink); color: #fff;
    box-shadow: 0 3px 0 rgba(0,0,0,.25);
    animation: pop .25s ease-out;
  }
  .pw.shield { background: #4ea3dc; }
  .pw.boost { background: #d9604a; }
  .pw.jump { background: #6fae3e; }
  @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }

  /* alert meter */
  .meter {
    width: clamp(120px, 20vw, 260px); height: .85em;
    background: rgba(0,0,0,.4); border: 3px solid var(--ink);
    border-radius: 99px; overflow: hidden; position: relative;
  }
  .meter i {
    position: absolute; inset: 0; display: block;
    background: linear-gradient(90deg, #f0c040, #e8763a);
    transform-origin: left center; transform: scaleX(0);
    transition: transform .12s linear;
  }
  .meter i.hot { background: linear-gradient(90deg, #ff6a4a, #d4271a); animation: throb .4s infinite alternate; }
  @keyframes throb { to { filter: brightness(1.5); } }

  #progress { width: clamp(140px, 26vw, 420px); height: .6em; }
  #progress i { background: linear-gradient(90deg, #7fc45a, #3f8f3a); transition: transform .3s ease-out; }

  #toast {
    position: fixed; left: 50%; top: 14%; transform: translateX(-50%);
    background: var(--ink); color: var(--paper);
    padding: .55em 1.1em; border-radius: 99px; font-weight: 800;
    font-size: clamp(13px, 1.9vmin, 20px);
    opacity: 0; transition: opacity .25s; pointer-events: none;
    box-shadow: 0 6px 18px rgba(0,0,0,.45);
  }
  #promptHint {
    position: fixed; left: 50%; bottom: 18%; transform: translateX(-50%);
    background: var(--paper); border: 3px solid var(--ink); border-radius: 12px;
    padding: .45em .9em; font-weight: 700; opacity: 0; transition: opacity .2s;
    box-shadow: var(--shadow); font-size: clamp(12px, 1.6vmin, 17px);
  }
  kbd {
    background: var(--ink); color: var(--paper); border-radius: 6px;
    padding: .12em .45em; font-family: var(--font); font-weight: 800; font-size: .92em;
    box-shadow: 0 2px 0 rgba(0,0,0,.4); margin: 0 .1em;
  }

  #muteBtn {
    pointer-events: auto; cursor: pointer;
    background: var(--paper); border: 3px solid var(--ink); border-radius: 10px;
    font: inherit; font-weight: 800; padding: .4em .7em; color: var(--ink);
    box-shadow: 0 4px 0 rgba(0,0,0,.25);
  }
  #muteBtn:active, #irBtn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,.25); }
  #irBtn {
    pointer-events: auto; cursor: pointer;
    background: var(--paper); border: 3px solid var(--ink); border-radius: 10px;
    font: inherit; font-weight: 800; padding: .4em .7em; color: var(--ink);
    box-shadow: 0 4px 0 rgba(0,0,0,.25); letter-spacing: .06em;
  }
  #irBtn.hidden { display: none; }
  #irBtn.on { background: #1d3b33; color: #7dffc4; border-color: #7dffc4; text-shadow: 0 0 8px #7dffc4; }

  /* Thermal camera: the HUD goes monochrome green with the sensor. */
  #hud.ir .panel {
    background: linear-gradient(rgba(12,30,26,.92), rgba(8,22,20,.92));
    border-color: #5fe0a8; color: #8dffc8;
    box-shadow: 0 0 14px rgba(95,224,168,.35);
  }
  #hud.ir .panel .lbl { color: #4fbf90; }
  #hud.ir #hearts i { background: #7dffc4; }
  #hud.ir .meter { border-color: #5fe0a8; }
  #hud.ir .meter i { background: linear-gradient(90deg, #7dffc4, #2fae7a); }
  #hud.ir #muteBtn { background: #0f2420; color: #7dffc4; border-color: #5fe0a8; }
  #hud.ir #toast { background: #0f2420; color: #7dffc4; }

  /* ---------- menus ---------- */
  #menu {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, rgba(10,14,20,.5), rgba(8,10,16,.88));
    -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); padding: 4vmin; overflow-y: auto; z-index: 20;
  }
  #menu.show { display: flex; animation: fade .3s ease; }
  @keyframes fade { from { opacity: 0; } }
  #menuBody {
    background: linear-gradient(#fffdf4, var(--paper));
    border: 5px solid var(--ink); border-radius: 26px;
    box-shadow: var(--shadow);
    padding: clamp(20px, 4vmin, 44px);
    max-width: min(760px, 94vw); width: 100%;
    text-align: center; position: relative;
    animation: rise .35s cubic-bezier(.2,1.3,.4,1);
  }
  @keyframes rise { from { transform: translateY(26px) scale(.96); opacity: 0; } }

  .title-art .kicker {
    font-size: clamp(11px, 1.6vmin, 15px); letter-spacing: .22em; text-transform: uppercase;
    font-weight: 800; color: var(--deep); opacity: .8; margin-bottom: .6em;
  }
  #menuBody h1 {
    margin: 0 0 .25em; line-height: .92;
    font-size: clamp(42px, 9vmin, 96px); font-weight: 900; letter-spacing: -.03em;
    color: var(--deep);
    text-shadow: 0 4px 0 #e9d3a8, 0 8px 0 rgba(0,0,0,.14);
  }
  #menuBody h1 span { color: var(--green); }
  #menuBody h2 {
    margin: 0 0 .5em; font-size: clamp(22px, 4vmin, 38px); font-weight: 900; letter-spacing: -.02em;
  }
  .sub { margin: 0 0 1.4em; font-size: clamp(13px, 1.9vmin, 18px); line-height: 1.5; opacity: .78; }
  .note { font-size: clamp(12px, 1.6vmin, 15px); opacity: .7; margin: 1.2em 0 0; }

  .row { display: flex; flex-wrap: wrap; gap: .7em; justify-content: center; margin-top: 1.2em; }
  .row button, .lvl {
    font: inherit; font-weight: 800; cursor: pointer;
    background: var(--paper); color: var(--ink);
    border: 4px solid var(--ink); border-radius: 14px;
    padding: .7em 1.2em; font-size: clamp(13px, 1.9vmin, 18px);
    box-shadow: 0 5px 0 rgba(0,0,0,.3);
    transition: transform .08s, box-shadow .08s, background .15s;
  }
  .row button:hover, .lvl:hover:not(.locked) { background: #fff; transform: translateY(-2px); box-shadow: 0 7px 0 rgba(0,0,0,.3); }
  .row button:active, .lvl:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.3); }
  .row button.primary { background: var(--green); color: #fff; }
  .row button.primary:hover { background: #4aa544; }

  .levels { display: grid; gap: .7em; margin: 1.2em 0; }
  .lvl { display: flex; align-items: center; gap: 1em; text-align: left; width: 100%; }
  .lvl .num {
    width: 2.1em; height: 2.1em; flex: 0 0 auto; border-radius: 50%;
    background: var(--warm); color: #fff; display: grid; place-items: center;
    font-size: 1.15em; font-weight: 900; border: 3px solid var(--ink);
  }
  .lvl .info { display: flex; flex-direction: column; gap: .25em; }
  .lvl .info em { font-style: normal; font-weight: 600; opacity: .66; font-size: .86em; }
  .lvl.locked { opacity: .42; cursor: not-allowed; filter: grayscale(.7); }
  .lvl.locked .num { background: #999; }

  .stats { display: flex; flex-wrap: wrap; gap: 1em; justify-content: center; margin: 1.4em 0 .4em; }
  .stats div {
    min-width: 6.5em; padding: .7em 1em; border-radius: 14px;
    background: rgba(0,0,0,.05); border: 3px solid rgba(46,40,34,.18);
  }
  .stats b { display: block; font-size: clamp(20px, 3.4vmin, 32px); font-weight: 900; color: var(--deep); }
  .stats span { font-size: .78em; text-transform: uppercase; letter-spacing: .08em; opacity: .62; font-weight: 700; }
  .stats.big b { font-size: clamp(28px, 5vmin, 48px); }

  .stamp {
    display: inline-block; transform: rotate(-7deg);
    border: 5px solid var(--green); color: var(--green);
    border-radius: 12px; padding: .15em .6em; margin-bottom: .5em;
    font-size: clamp(20px, 3.6vmin, 34px); font-weight: 900; letter-spacing: .06em;
    text-transform: uppercase; opacity: .9;
  }
  .stamp.bad { border-color: var(--red); color: var(--red); }

  .keys { display: grid; gap: .6em; text-align: left; margin: 0 auto; max-width: 30em; }
  .keys div { display: flex; align-items: baseline; gap: .5em; flex-wrap: wrap; }
  .keys span { opacity: .72; font-size: .92em; }

  /* ---------- touch ---------- */
  #touch { position: fixed; inset: 0; display: none; pointer-events: none; z-index: 15; }
  #touch.show { display: block; }
  #touch .pad { position: absolute; bottom: 3vmin; display: flex; gap: 1.6vmin; align-items: flex-end; pointer-events: auto; }
  #touch .left { left: 3vmin; }
  #touch .right { right: 3vmin; }
  #touch .stack { display: flex; flex-direction: column; gap: 1.2vmin; }
  #touch button {
    width: 13vmin; height: 13vmin; border-radius: 50%;
    border: 4px solid rgba(46,40,34,.8); background: rgba(253,246,230,.66);
    font: inherit; font-weight: 900; font-size: 4.4vmin; color: var(--ink);
    display: grid; place-items: center; touch-action: none;
  }
  #touch button.big { width: 17vmin; height: 17vmin; font-size: 3.4vmin; background: rgba(120,190,110,.8); }
  #touch button.wide { width: 15vmin; height: 10vmin; border-radius: 5vmin; font-size: 2.9vmin; }
  #touch .stack button { width: 11vmin; height: 9vmin; border-radius: 4vmin; font-size: 3.4vmin; }
  #touch button.down { background: var(--warm); color: #fff; }

  /* ---------- portrait ---------- */
  #rotate {
    position: fixed; inset: 0; display: none; z-index: 60;
    background: #11151c; color: var(--paper);
    align-items: center; justify-content: center; text-align: center; padding: 8vmin;
  }
  #rotate.show { display: flex; }
  #rotate h2 { margin: .8em 0 .3em; font-size: 6vmin; font-weight: 900; }
  #rotate p { margin: 0; opacity: .72; font-size: 3.6vmin; }
  .phone {
    width: 22vmin; height: 13vmin; margin: 0 auto;
    border: 1.2vmin solid var(--paper); border-radius: 2vmin;
    animation: tilt 1.8s ease-in-out infinite;
  }
  @keyframes tilt {
    0%, 40% { transform: rotate(90deg); }
    60%, 100% { transform: rotate(0deg); }
  }

  #fatal {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: #11151c; color: var(--paper); z-index: 50; padding: 6vmin; text-align: center;
  }
  #fatal .card { max-width: 32em; }

  #boot {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: #11151c; color: #d8c9a8; z-index: 40; font-weight: 800;
    letter-spacing: .14em; text-transform: uppercase; font-size: 14px;
    transition: opacity .4s;
  }
  #boot.gone { opacity: 0; pointer-events: none; }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
  <div class="hud-row">
    <div class="panel"><div id="hearts"></div></div>
    <div class="panel lootbox">
      <span class="lbl">Loot</span><b id="loot">0</b><span class="lbl">/ <span id="lootMax">0</span></span>
    </div>
    <div class="panel"><span class="lbl">Score</span><b id="score">0</b></div>
    <div class="panel"><span class="lbl">Crumbs</span><b id="crumbCount">0</b></div>
    <div id="powerups"></div>
    <div class="spacer"></div>
    <div class="panel" style="flex-direction:column;align-items:flex-end;gap:.35em">
      <span id="levelName" style="font-weight:700"></span>
      <div class="meter" id="tension"><i id="tensionFill"></i></div>
    </div>
    <button id="irBtn" class="hidden">IR</button>
    <button id="muteBtn">♪ on</button>
  </div>

  <div class="hud-row bottom">
    <div class="panel"><span class="lbl">Time</span><b id="timer" style="font-size:1.1em">0.0s</b></div>
    <div class="spacer"></div>
    <div class="panel" style="flex-direction:column;align-items:flex-end;gap:.4em">
      <span class="lbl">To the hedge</span>
      <div class="meter" id="progress"><i id="progressFill"></i></div>
    </div>
  </div>
</div>

<div id="toast"></div>
<div id="promptHint">Crouch and press <kbd>E</kbd> to lift the bait</div>

<div id="touch">
  <div class="pad left">
    <button data-btn="left">◀</button>
    <div class="stack">
      <button data-btn="up">▲</button>
      <button data-btn="down">▼</button>
    </div>
    <button data-btn="right">▶</button>
  </div>
  <div class="pad right">
    <button data-btn="sneak" class="wide">SNEAK</button>
    <button data-btn="act">E</button>
    <button data-btn="jump" class="big">JUMP</button>
  </div>
</div>

<div id="rotate">
  <div>
    <div class="phone"></div>
    <h2>Turn your device sideways</h2>
    <p>Will's Backyard is a side-scroller &mdash; it needs the long edge.</p>
  </div>
</div>

<div id="menu"><div id="menuBody"></div></div>
<div id="fatal"></div>
<div id="boot">Setting the table&hellip;</div>

// ============================================================================
// Will's Backyard -- sprite atlas authoring
// Every sprite is drawn synchronously with Canvas2D into one texture atlas.
// Style target: Paper Mario (Switch) -- flat cut-out shapes, inked edges,
// one soft gradient for form, a crease highlight, warm paper grain.
// ============================================================================

// Path2D.roundRect landed in Safari 16.4. Without this the whole atlas throws
// on older iOS and the game never starts.
(function () {
  function roundRectPoly(x, y, w, h, r) {
    if (typeof r !== 'number') r = (r && r.length) ? r[0] : 0;
    r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
    this.moveTo(x + r, y);
    this.lineTo(x + w - r, y);
    this.arcTo(x + w, y, x + w, y + r, r);
    this.lineTo(x + w, y + h - r);
    this.arcTo(x + w, y + h, x + w - r, y + h, r);
    this.lineTo(x + r, y + h);
    this.arcTo(x, y + h, x, y + h - r, r);
    this.lineTo(x, y + r);
    this.arcTo(x, y, x + r, y, r);
    this.closePath();
    return this;
  }
  if (typeof Path2D !== 'undefined' && !Path2D.prototype.roundRect) {
    Path2D.prototype.roundRect = roundRectPoly;
  }
  if (typeof CanvasRenderingContext2D !== 'undefined' &&
      !CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = roundRectPoly;

var ART = {};           // name -> {w, h, draw}  (insertion order == sprite id)

var PIX = 2;            // authoring supersample
var INK = 0.42;         // how much darker an outline is than its fill

// ---- color utils -----------------------------------------------------------
function hex2rgb(h) {
  h = h.replace('#', '');
  if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
  return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
}
function rgb2hex(r, g, b) {
  var f = function (v) { return Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0'); };
  return '#' + f(r) + f(g) + f(b);
}
// amt < 0 darkens toward ink; amt > 0 lifts toward paper white
function sh(col, amt) {
  var c = hex2rgb(col), r = c[0], g = c[1], b = c[2];
  if (amt < 0) { var t = -amt; return rgb2hex(r * (1 - t) + 26 * t, g * (1 - t) + 20 * t, b * (1 - t) + 30 * t); }
  return rgb2hex(r + (255 - r) * amt, g + (255 - g) * amt, b + (252 - b) * amt);
}
function rgba(col, a) { var c = hex2rgb(col); return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }

// ---- palette ---------------------------------------------------------------
var C = {
  // rat
  fur: '#8f8279', furDark: '#6b6058', belly: '#cdc0b0', pink: '#e9a7a8',
  // Will
  skin: '#e7b188', skinSh: '#c8906a', hair: '#4b382c',
  plaid: '#5e8bad', plaidDk: '#3c6382', tee: '#b9c3cb', jeans: '#52708f',
  // Popcorn
  coat: '#f7f3ec', coatSh: '#ded5c6', brindle: '#a2866b', brindleDk: '#75604a',
  tutu: '#ff92c6', harness: '#6d4a90', leash: '#ff6f5c',
  // world
  grass: '#7cbf42', grassDk: '#58992d', grassLt: '#9ad85c',
  dirt: '#8a6b4a', dirtDk: '#6a5038',
  wood: '#b07a44', woodDk: '#85592e',
  deck: '#8a6243', deckDk: '#63432c',
  siding: '#4d5f6d', sidingDk: '#3a4955', trim: '#eef2f3',
  hedge: '#3f8f3a', hedgeDk: '#2b6b2a', hedgeLt: '#63b355',
  leafA: '#e9a63c', leafB: '#cf6a26', leafC: '#b8402f', leafD: '#f0c84c',
  pumpkin: '#f0881f', pumpkinDk: '#c4650f', stem: '#6f8a3a',
  steel: '#9aa5ad', steelDk: '#5f6a72',
  slide: '#f5cf3b', cheese: '#f7c93f', bacon: '#d9604a', bun: '#e0a85f'
};

// ---- paper-cutout primitives ----------------------------------------------
// Fill a path, ink its edge, pool a soft form-shadow, keep the light upper-left.
function paper(c, path, fill, o) {
  o = o || {};
  var w = o.w || 100, h = o.h || 100;
  c.save();
  c.fillStyle = fill;
  c.fill(path);
  if (o.shade !== false) {
    var g = c.createLinearGradient(0, 0, w * 0.55, h);
    g.addColorStop(0.0, rgba(sh(fill, 0.34), 0.55));
    g.addColorStop(0.42, 'rgba(255,255,255,0)');
    g.addColorStop(1.0, rgba(sh(fill, -0.38), 0.50));
    c.save(); c.clip(path); c.fillStyle = g; c.fillRect(0, 0, w, h); c.restore();
  }
  if (o.ink !== false) {
    c.lineJoin = 'round'; c.lineCap = 'round';
    c.strokeStyle = o.inkCol || sh(fill, -INK);
    c.lineWidth = o.lw != null ? o.lw : 3.2 * PIX;
    c.stroke(path);
  }
  c.restore();
}

// A thin bright line suggesting a fold in the paper.
function crease(c, d, col, lw, alpha) {
  c.save();
  c.strokeStyle = rgba(col || '#ffffff', alpha != null ? alpha : 0.33);
  c.lineWidth = (lw || 2) * PIX; c.lineCap = 'round';
  c.stroke(new Path2D(d));
  c.restore();
}

// Deterministic noise -- the atlas must be byte-identical between loads.
var _seed = 0x2f6e2b1;
function rnd() { _seed ^= _seed << 13; _seed ^= _seed >>> 17; _seed ^= _seed << 5; _seed |= 0; return ((_seed >>> 0) % 100000) / 100000; }
function srnd(s) { _seed = (s | 0) || 1; }

// Faint fibrous grain so flat fills read as paper, not plastic.
function grain(c, w, h, amount) {
  var a = amount != null ? amount : 0.05;
  c.save();
  c.globalCompositeOperation = 'overlay';
  var n = w * h * 0.016;
  for (var i = 0; i < n; i++) {
    var x = rnd() * w, y = rnd() * h, l = 1 + rnd() * 3 * PIX;
    c.strokeStyle = rnd() > 0.5 ? 'rgba(255,255,255,' + a + ')' : 'rgba(60,40,20,' + a + ')';
    c.lineWidth = PIX * 0.6;
    c.beginPath(); c.moveTo(x, y); c.lineTo(x + l, y + l * 0.3); c.stroke();
  }
  c.restore();
}

function ellipsePath(x, y, rx, ry, rot) {
  var p = new Path2D();
  p.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), rot || 0, 0, Math.PI * 2);
  return p;
}
function roundRect(x, y, w, h, r) { var p = new Path2D(); p.roundRect(x, y, w, h, r); return p; }

// Wood grain used by the deck, the hutch and the playhouse.
function woodGrain(c, w, h, base, seed, vertical) {
  srnd(seed);
  c.save();
  c.globalAlpha = 0.5;
  c.strokeStyle = sh(base, -0.3);
  c.lineWidth = 1.4 * PIX; c.lineCap = 'round';
  var n = vertical ? Math.max(2, w / 9) : Math.max(2, h / 9);
  for (var i = 0; i < n; i++) {
    var t = (i + 0.5) / n;
    c.globalAlpha = 0.16 + rnd() * 0.24;
    c.beginPath();
    if (vertical) {
      var x = t * w + (rnd() - 0.5) * 4;
      c.moveTo(x, 0); c.bezierCurveTo(x + 3, h * 0.33, x - 3, h * 0.66, x + 1, h);
    } else {
      var y = t * h + (rnd() - 0.5) * 4;
      c.moveTo(0, y); c.bezierCurveTo(w * 0.33, y + 3, w * 0.66, y - 3, w, y + 1);
    }
    c.stroke();
  }
  // a couple of knots
  c.globalAlpha = 0.3;
  for (var k = 0; k < 2; k++) {
    var kx = rnd() * w, ky = rnd() * h, kr = 2 + rnd() * 3;
    c.lineWidth = 1.2 * PIX;
    c.beginPath(); c.ellipse(kx, ky, kr * 2.2, kr, rnd(), 0, Math.PI * 2); c.stroke();
    c.beginPath(); c.ellipse(kx, ky, kr, kr * 0.5, rnd(), 0, Math.PI * 2); c.stroke();
  }
  c.restore();
}

// Registers a sprite. w/h are authoring pixels (already supersampled).
function def(name, w, h, draw) { ART[name] = { w: Math.round(w), h: Math.round(h), draw: draw }; }

// Popcorn -- white hound/pointer with brown brindle patches, long floppy ears,
// a plum harness and her pink tutu, after the reference photo.
//
// Everything is authored FACING RIGHT with canvas y pointing DOWN, so:
//   * the skull sits up-and-left, the muzzle runs down-and-right
//   * ears and legs hang DOWNWARD from a joint on their top edge
// The rig only ever applies small rotations, so nothing can turn over.
// ============================================================================

// ---- the head --------------------------------------------------------------
// Domed skull, clear stop, long tapering muzzle, nose at the far tip.
function houndHead(c, w, h, open) {
  srnd(32);

  var skull = new Path2D();
  skull.moveTo(16, 46);                          // nape, where the neck meets
  skull.bezierCurveTo(10, 22, 30, 8, 54, 8);     // over the top of the skull
  skull.bezierCurveTo(72, 8, 82, 20, 84, 34);    // forehead down to the stop
  skull.bezierCurveTo(100, 36, 116, 42, 126, 50);// bridge of the muzzle
  skull.bezierCurveTo(133, 55, 131, 64, 122, 66);// over the nose leather
  if (open) {
    skull.bezierCurveTo(112, 68, 102, 66, 94, 62);
    skull.bezierCurveTo(84, 62, 70, 60, 58, 58); // upper jaw only
  } else {
    skull.bezierCurveTo(112, 72, 100, 74, 90, 70);// flews hanging below
    skull.bezierCurveTo(76, 80, 54, 80, 38, 72); // chin and jaw
  }
  skull.bezierCurveTo(24, 66, 17, 56, 16, 46);
  skull.closePath();
  paper(c, skull, C.coat, { w: w, h: h, lw: 2.8 * PIX, inkCol: '#9b8e7d' });

  // Brindle mask across the eye and the base of the ear.
  c.save();
  c.clip(skull);
  c.fillStyle = rgba(C.brindle, 0.92);
  c.fill(ellipsePath(40, 32, 24, 19, 0.15));
  c.fillStyle = rgba(C.brindleDk, 0.3);
  c.fill(ellipsePath(36, 30, 14, 11, 0.15));
  // Faint ticking on the muzzle, like the photo.
  c.fillStyle = rgba(C.brindle, 0.35);
  for (var i = 0; i < 7; i++) c.fill(ellipsePath(84 + rnd() * 38, 46 + rnd() * 18, 3, 2.2, rnd()));
  c.restore();

  if (open) {
    // Dropped lower jaw with tongue and a couple of teeth.
    var jaw = new Path2D();
    jaw.moveTo(60, 58);
    jaw.bezierCurveTo(80, 62, 104, 70, 108, 82);
    jaw.bezierCurveTo(98, 92, 70, 84, 58, 70);
    jaw.closePath();
    paper(c, jaw, C.coat, { w: w, h: h, lw: 2.4 * PIX, inkCol: '#9b8e7d', shade: false });
    var mouth = new Path2D();
    mouth.moveTo(64, 60); mouth.bezierCurveTo(84, 66, 101, 73, 103, 80);
    mouth.bezierCurveTo(92, 85, 68, 74, 62, 64);
    mouth.closePath();
    c.fillStyle = '#7a3430'; c.fill(mouth);
    c.fillStyle = '#ef8f98'; c.fill(ellipsePath(88, 75, 11, 5, 0.3));
    c.fillStyle = '#ffffff';
    c.beginPath(); c.moveTo(66, 60); c.lineTo(71, 69); c.lineTo(75, 61); c.closePath(); c.fill();
  }

  // Nose: dark leather at the very tip of the muzzle.
  c.fillStyle = '#2b2420';
  c.fill(ellipsePath(122, 56, 9, 7, -0.3));
  c.fillStyle = 'rgba(255,255,255,0.3)';
  c.fill(ellipsePath(119, 53, 3, 2, -0.3));
  c.save();
  c.strokeStyle = 'rgba(70,56,44,0.7)'; c.lineWidth = 1.8 * PIX; c.lineCap = 'round';
  c.beginPath(); c.moveTo(122, 62); c.lineTo(120, 67); c.stroke();   // philtrum
  c.restore();

  // Eye, set in the brindle mask, looking forward.
  c.fillStyle = '#ffffff'; c.fill(ellipsePath(52, 36, 9, 8, 0));
  c.fillStyle = '#4a3324'; c.fill(ellipsePath(55, 36, 6.4, 6.8, 0));
  c.fillStyle = '#17110d'; c.fill(ellipsePath(56, 36, 3.4, 3.6, 0));
  c.fillStyle = 'rgba(255,255,255,0.95)'; c.fill(ellipsePath(53, 33.5, 2.3, 2.3, 0));
  c.save();
  c.strokeStyle = 'rgba(60,46,34,0.55)'; c.lineWidth = 2 * PIX; c.lineCap = 'round';
  c.beginPath(); c.moveTo(45, 28); c.quadraticCurveTo(54, 25, 62, 30); c.stroke();
  c.restore();

  if (!open) {
    // The closed mouth line, running back from the nose under the flews.
    c.save();
    c.strokeStyle = 'rgba(95,78,60,0.8)'; c.lineWidth = 2.2 * PIX; c.lineCap = 'round';
    c.beginPath(); c.moveTo(118, 64); c.quadraticCurveTo(102, 71, 88, 69); c.stroke();
    c.restore();
  }
  grain(c, w, h, 0.03);
}

def('pop_head', 142, 88, function (c, w, h) { houndHead(c, w, h, false); });
def('pop_head_bark', 142, 98, function (c, w, h) { houndHead(c, w, h, true); });

// ---- the ear ---------------------------------------------------------------
// Long brown hound ear. Joint is the top edge; it hangs straight down.
def('pop_ear', 52, 96, function (c, w, h) {

  p.moveTo(20, 3);
  p.bezierCurveTo(40, 6, 48, 26, 46, 52);        // outer edge, widening low
  p.bezierCurveTo(44, 74, 35, 90, 24, 92);       // rounded tip
  p.bezierCurveTo(13, 90, 7, 72, 6, 48);

  p.closePath();
  paper(c, p, C.brindle, { w: w, h: h, lw: 2.6 * PIX });
  c.save(); c.clip(p);
  // Darker along the trailing edge so it reads as hanging cloth-like.
  var g = c.createLinearGradient(0, 0, w, 0);

// ---- the body --------------------------------------------------------------
// Pointer build: deep chest, tucked loin, and the neck built in so the head
// never looks detached.
def('pop_body', 196, 124, function (c, w, h) {
  srnd(31);
  var p = new Path2D();
  p.moveTo(20, 66);                              // over the hind leg
  p.bezierCurveTo(12, 38, 28, 22, 56, 20);       // croup / rump
  p.bezierCurveTo(88, 18, 114, 22, 132, 30);     // level back
  p.bezierCurveTo(142, 18, 154, 8, 168, 7);      // withers up into the neck
  p.bezierCurveTo(182, 6, 190, 15, 187, 27);     // crest of the neck
  p.bezierCurveTo(182, 40, 166, 50, 152, 56);    // throat
  p.bezierCurveTo(158, 74, 154, 94, 142, 104);   // brisket, deep chest
  p.bezierCurveTo(128, 114, 108, 110, 96, 102);  // behind the front leg
  p.bezierCurveTo(74, 112, 42, 106, 28, 90);     // belly, tucked at the loin
  p.bezierCurveTo(20, 82, 19, 73, 20, 66);
  p.closePath();
  paper(c, p, C.coat, { w: w, h: h, lw: 3 * PIX, inkCol: '#9b8e7d' });

  c.save();
  c.clip(p);
  // Brindle patches, hand-placed so she is the same dog every run.
  var spots = [[52, 40, 21, 15, 0.2], [112, 36, 25, 17, -0.12], [146, 76, 15, 12, 0.35], [74, 86, 13, 10, 0.1]];
  for (var i = 0; i < spots.length; i++) {
    var s = spots[i];
    c.fillStyle = rgba(C.brindle, 0.9);
    c.fill(ellipsePath(s[0], s[1], s[2], s[3], s[4]));
    c.fillStyle = rgba(C.brindleDk, 0.3);
    c.fill(ellipsePath(s[0] + 2, s[1] + 3, s[2] * 0.55, s[3] * 0.55, s[4]));
  }
  // Shading under the ribs and along the belly.
  var g = c.createLinearGradient(0, 24, 0, h);
  g.addColorStop(0, 'rgba(255,255,255,0.18)');
  g.addColorStop(0.55, 'rgba(255,255,255,0)');
  g.addColorStop(1, rgba(C.coatSh, 0.8));
  c.fillStyle = g; c.fillRect(0, 0, w, h);
  // A soft line marking the shoulder.
  c.strokeStyle = rgba(C.coatSh, 0.75); c.lineWidth = 2.4 * PIX; c.lineCap = 'round';
  c.beginPath(); c.moveTo(140, 44); c.quadraticCurveTo(132, 70, 136, 96); c.stroke();
  c.restore();
  grain(c, w, h, 0.04);
});

// ---- the tutu --------------------------------------------------------------
// Bright pink tulle gathered at the waist and flaring over the hindquarters,
// as in the reference photo. Layered translucent skirts rather than one slab,
// so it reads as netting rather than fabric.
def('pop_tutu', 156, 118, function (c, w, h) {
  srnd(33);

  // Back skirt, darkest and widest.
  var back = new Path2D();
  back.moveTo(30, 34);
  back.bezierCurveTo(60, 14, 104, 16, 132, 36);
  back.bezierCurveTo(146, 56, 142, 86, 124, 100);
  back.bezierCurveTo(96, 114, 54, 112, 30, 96);
  back.bezierCurveTo(14, 80, 14, 50, 30, 34);
  back.closePath();
  c.save();
  c.globalAlpha = 0.75;
  paper(c, back, sh(C.tutu, -0.18), { w: w, h: h, lw: 2.4 * PIX, shade: false });
  c.restore();

  // Front skirt, brighter and slightly smaller.
  var front = new Path2D();
  front.moveTo(38, 40);
  front.bezierCurveTo(64, 24, 100, 26, 122, 44);
  front.bezierCurveTo(134, 62, 130, 84, 114, 96);
  front.bezierCurveTo(90, 106, 56, 104, 38, 90);
  front.bezierCurveTo(26, 76, 26, 54, 38, 40);
  front.closePath();
  paper(c, front, C.tutu, { w: w, h: h, lw: 2.6 * PIX });

  // Vertical gathers radiating from the waistband.
  c.save();
  c.clip(front);
  c.strokeStyle = 'rgba(255,255,255,0.42)';
  c.lineWidth = 2.2 * PIX;
  c.lineCap = 'round';
  for (var i = 0; i < 11; i++) {
    var t = i / 10;
    var x0 = 48 + t * 60;
    var x1 = 34 + t * 92;
    c.beginPath();
    c.moveTo(x0, 34);
    c.quadraticCurveTo(x1 - 4, 68, x1, 102);
    c.stroke();
  }
  // A little depth under the waistband.
  var g = c.createLinearGradient(0, 24, 0, h);
  g.addColorStop(0, rgba(sh(C.tutu, -0.3), 0.55));
  g.addColorStop(0.4, 'rgba(255,255,255,0)');
  g.addColorStop(1, rgba(sh(C.tutu, -0.22), 0.4));
  c.fillStyle = g;
  c.fillRect(0, 0, w, h);
  c.restore();

  // Scalloped hem, so the edge reads as netting.
  c.save();
  c.strokeStyle = rgba(sh(C.tutu, 0.4), 0.8);
  c.lineWidth = 2 * PIX;
  c.beginPath();
  for (var k = 0; k < 7; k++) {
    var hx = 40 + k * 13;
    c.moveTo(hx, 96 + (k % 2) * 4);
    c.arc(hx + 6, 96 + (k % 2) * 4, 7, Math.PI, 0, true);
  }
  c.stroke();
  c.restore();

  // Waistband, gathered tight.
  paper(c, roundRect(52, 22, 56, 18, 9), sh(C.tutu, -0.26), { w: w, h: h, lw: 2.2 * PIX, shade: false });
  c.save();
  c.strokeStyle = 'rgba(255,255,255,0.45)';
  c.lineWidth = 1.8 * PIX;
  c.beginPath();
  for (var j = 0; j < 6; j++) { c.moveTo(58 + j * 9, 24); c.lineTo(58 + j * 9, 38); }
  c.stroke();
  c.restore();
});
// ============================================================================
// Raccoons -- the ambushers on the last level, built after Jimmothy.
//
// The proportions ARE the joke: an enormous round boulder of fur, a small head
// carried low and pushed forward, and four spindly dark legs that look wholly
// inadequate for the job. The tail is a short stub, not the long ringed plume
// raccoons are usually drawn with.
//
// Authored FACING RIGHT. Limbs and tail hang DOWNWARD from a joint on their
// top edge, so the rig only ever applies gentle rotations.
// ============================================================================

var RC = {
  fur: '#9a9792',        // silver-grey guard hair
  furLt: '#c3c0ba',
  furDk: '#55524e',
  belly: '#7e7b77',
  leg: '#3f3d3a',        // legs go almost black toward the feet
  mask: '#2b2825',
  muzzle: '#d9d4ca',
  ear: '#a8a39d',
  tailTip: '#9c7f5c',    // the warm brown stub in the photo
  eye: '#efe3ad'
};

// ---- the boulder -----------------------------------------------------------
def('rac_body', 196, 166, function (c, w, h) {
  srnd(61);

  // One big dome: high rounded back, deep sides, belly close to the ground.
  var p = new Path2D();
  p.moveTo(14, 104);
  p.bezierCurveTo(6, 64, 30, 24, 76, 14);        // haunch sweeping up
  p.bezierCurveTo(122, 4, 164, 24, 178, 62);     // over the top of the dome
  p.bezierCurveTo(190, 92, 184, 118, 168, 132);  // down the shoulder
  p.bezierCurveTo(150, 146, 118, 150, 90, 146);
  p.bezierCurveTo(56, 150, 24, 136, 14, 104);
  p.closePath();
  paper(c, p, RC.fur, { w: w, h: h, lw: 3.2 * PIX });

  c.save();
  c.clip(p);
  // Lighter along the top of the dome, darker underneath.
  var g = c.createLinearGradient(0, 6, 0, h);
  g.addColorStop(0, rgba(RC.furLt, 0.8));
  g.addColorStop(0.42, 'rgba(255,255,255,0)');
  g.addColorStop(1, rgba(RC.furDk, 0.78));
  c.fillStyle = g; c.fillRect(0, 0, w, h);
  // Dark saddle smeared across the shoulders.
  c.fillStyle = rgba(RC.furDk, 0.3);
  c.fill(ellipsePath(120, 56, 56, 34, -0.2));
  c.restore();

  // Spiky guard hairs breaking the top silhouette -- the coat reads coarse.
  c.save();
  c.strokeStyle = RC.fur; c.lineWidth = 2.6 * PIX; c.lineCap = 'round';
  for (var i = 0; i < 34; i++) {
    var t = i / 33;
    var ax = 20 + t * 158;
    // Follow the dome's top edge.
    var ay = 104 - Math.sin(t * Math.PI) * 92 + rnd() * 6;
    var len = 7 + rnd() * 11;
    var dir = -0.9 - t * 0.9 + (rnd() - 0.5) * 0.5;
    c.strokeStyle = rnd() > 0.5 ? RC.furLt : RC.furDk;
    c.beginPath();
    c.moveTo(ax, ay);
    c.lineTo(ax + Math.cos(dir) * len, ay + Math.sin(dir) * len);
    c.stroke();
  }
  c.restore();
  grain(c, w, h, 0.05);
});

// ---- the small, low-slung head ---------------------------------------------
function raccoonHead(c, w, h, snarl) {
  srnd(62);

  // Short wedge: rounded skull, muzzle angled DOWN and forward.
  var skull = new Path2D();
  skull.moveTo(10, 36);
  skull.bezierCurveTo(8, 18, 24, 6, 44, 6);       // top of the skull
  skull.bezierCurveTo(62, 6, 72, 16, 76, 30);     // brow
  skull.bezierCurveTo(88, 38, 96, 50, 94, 60);    // muzzle, angling down
  skull.bezierCurveTo(92, 70, 80, 74, 70, 70);
  if (snarl) {
    skull.bezierCurveTo(58, 72, 34, 70, 20, 60);
  } else {
    skull.bezierCurveTo(56, 76, 32, 74, 18, 62);
  }
  skull.bezierCurveTo(11, 54, 10, 44, 10, 36);
  skull.closePath();
  paper(c, skull, RC.fur, { w: w, h: h, lw: 2.6 * PIX });

  c.save();
  c.clip(skull);
  // Pale brow stripe up the middle of the forehead.
  c.fillStyle = rgba(RC.muzzle, 0.8);
  c.fill(ellipsePath(42, 15, 20, 10, -0.12));
  // The mask: a dark band over the eyes, wider at the cheek.
  var mask = new Path2D();
  mask.moveTo(14, 32);
  mask.bezierCurveTo(26, 24, 48, 24, 62, 30);
  mask.bezierCurveTo(72, 34, 78, 40, 79, 46);
  mask.bezierCurveTo(64, 54, 44, 56, 30, 52);
  mask.bezierCurveTo(18, 48, 14, 40, 14, 32);
  mask.closePath();
  c.fillStyle = RC.mask; c.fill(mask);
  c.strokeStyle = rgba(RC.mask, 0.4); c.lineWidth = 3.4 * PIX; c.stroke(mask);
  // Pale muzzle below it.
  c.fillStyle = rgba(RC.muzzle, 0.95);
  c.fill(ellipsePath(78, 58, 18, 11, -0.2));
  c.restore();

  // Small round ears, set back and low -- they almost vanish into the fur.
  paper(c, ellipsePath(24, 10, 12, 11, -0.2), RC.ear, { w: w, h: h, lw: 2.2 * PIX });
  paper(c, ellipsePath(24, 12, 6, 5.5, -0.2), '#bdb0a8', { w: w, h: h, lw: 1.5 * PIX, shade: false });
  paper(c, ellipsePath(58, 8, 11, 10, 0.15), RC.ear, { w: w, h: h, lw: 2.2 * PIX });
  paper(c, ellipsePath(58, 10, 5.5, 5, 0.15), '#bdb0a8', { w: w, h: h, lw: 1.5 * PIX, shade: false });

  // Nose, at the low tip of the muzzle.
  c.fillStyle = '#211d1b';
  c.fill(ellipsePath(91, 56, 6.5, 5, -0.3));
  c.fillStyle = 'rgba(255,255,255,0.28)';
  c.fill(ellipsePath(89, 54, 2, 1.4, -0.3));

  // Eyes inside the mask -- pale, so they read against the black.
  function eye(x, y, r) {
    c.fillStyle = RC.eye; c.fill(ellipsePath(x, y, r, r * 0.9, 0));
    c.fillStyle = '#17120e'; c.fill(ellipsePath(x + 0.8, y, r * 0.44, r * 0.54, 0));
    c.fillStyle = 'rgba(255,255,255,0.9)'; c.fill(ellipsePath(x - r * 0.32, y - r * 0.34, r * 0.2, r * 0.2, 0));
  }
  eye(36, 37, 7);
  eye(62, 40, 6.6);

  if (snarl) {
    var mouth = new Path2D();
    mouth.moveTo(60, 68); mouth.bezierCurveTo(76, 70, 86, 78, 80, 88);
    mouth.bezierCurveTo(68, 94, 54, 84, 54, 74);
    mouth.closePath();
    c.fillStyle = '#6d2f2c'; c.fill(mouth);
    c.strokeStyle = sh(RC.fur, -0.42); c.lineWidth = 2.2 * PIX; c.stroke(mouth);
    c.fillStyle = '#ffffff';
    c.beginPath(); c.moveTo(60, 69); c.lineTo(64, 77); c.lineTo(68, 69); c.closePath(); c.fill();
    c.beginPath(); c.moveTo(71, 71); c.lineTo(74, 78); c.lineTo(77, 72); c.closePath(); c.fill();
    c.fillStyle = '#e88f94'; c.fill(ellipsePath(68, 86, 7, 3.4, 0.2));
  } else {
    c.save();
    c.strokeStyle = 'rgba(60,52,46,0.75)'; c.lineWidth = 1.8 * PIX; c.lineCap = 'round';
    c.beginPath(); c.moveTo(87, 62); c.quadraticCurveTo(76, 67, 68, 65); c.stroke();
    c.restore();
  }

  c.save();
  c.strokeStyle = 'rgba(245,240,232,0.5)'; c.lineWidth = 1.4 * PIX; c.lineCap = 'round';

// ---- skies (stretched full-screen; vertical gradient strips) ---------------
function skyStrip(stops) {
  return function (c, w, h) {
    var g = c.createLinearGradient(0, 0, 0, h);
    for (var i = 0; i < stops.length; i++) g.addColorStop(stops[i][0], stops[i][1]);
    c.fillStyle = g; c.fillRect(0, 0, w, h);
  };
}

// Loose soil: clods, pebbles and root threads. Deliberately not wood grain.
function soil(c, w, h, base, seed) {
  srnd(seed);
  c.save();
  for (var i = 0; i < 90; i++) {
    var x = rnd() * w, y = rnd() * h, r = 2 + rnd() * 9;
    c.globalAlpha = 0.10 + rnd() * 0.22;
    c.fillStyle = rnd() > 0.5 ? sh(base, -0.38) : sh(base, 0.22);
    c.beginPath(); c.ellipse(x, y, r, r * (0.5 + rnd() * 0.5), rnd() * 3, 0, Math.PI * 2); c.fill();
  }
  // A few pale pebbles.
  c.globalAlpha = 0.5;
  for (var k = 0; k < 10; k++) {
    c.fillStyle = '#b9a98f';
    c.beginPath(); c.ellipse(rnd() * w, rnd() * h, 3 + rnd() * 4, 2 + rnd() * 3, rnd() * 3, 0, Math.PI * 2); c.fill();
  }
  // Thin roots trailing down.
  c.globalAlpha = 0.3;
  c.strokeStyle = sh(base, -0.45); c.lineWidth = 1.4 * PIX; c.lineCap = 'round';
  for (var j = 0; j < 7; j++) {
    var rx = rnd() * w, ry = rnd() * h * 0.4;
    c.beginPath(); c.moveTo(rx, ry);
    c.bezierCurveTo(rx + 8, ry + 20, rx - 8, ry + 40, rx + 4, ry + 62);
    c.stroke();
  }
  c.restore();
}

// ---- vegetation -----------------------------------------------------------
function foliageBlob(seed, base, lite) {
  return function (c, w, h) {
    srnd(seed);
    var p = new Path2D();
    var cx = w / 2, cy = h / 2, n = 11;
    for (var i = 0; i <= n; i++) {
      var a = (i / n) * Math.PI * 2;
      var r = 0.34 + rnd() * 0.16;
      var x = cx + Math.cos(a) * w * r, y = cy + Math.sin(a) * h * r;
      if (i === 0) p.moveTo(x, y);
      else {
        var pa = ((i - 0.5) / n) * Math.PI * 2, pr = 0.44 + rnd() * 0.18;
        p.quadraticCurveTo(cx + Math.cos(pa) * w * pr, cy + Math.sin(pa) * h * pr, x, y);
      }
    }
    p.closePath();
    paper(c, p, base, { w: w, h: h, lw: 3.4 * PIX });
    c.save(); c.clip(p);
    c.fillStyle = rgba(lite, 0.55);
    for (var k = 0; k < 7; k++) c.fill(ellipsePath(rnd() * w, rnd() * h * 0.6, w * 0.1, h * 0.07, rnd()));
    c.restore();
    grain(c, w, h, 0.04);
  };
}

def('cobweb', 180, 180, function (c, w, h) {
  c.save();
  c.strokeStyle = 'rgba(226,228,232,0.4)'; c.lineWidth = 1.8 * PIX;
  for (var i = 0; i < 7; i++) {
    var a = (i / 7) * Math.PI * 0.55;
    c.beginPath(); c.moveTo(0, 0); c.lineTo(Math.cos(a) * 250, Math.sin(a) * 250); c.stroke();
  }
  for (var r = 30; r < 190; r += 30) {
    c.beginPath();
    for (var j = 0; j <= 7; j++) {
      var aa = (j / 7) * Math.PI * 0.55;
      var x = Math.cos(aa) * r, y = Math.sin(aa) * r;
      if (j === 0) c.moveTo(x, y); else c.quadraticCurveTo(Math.cos(aa - 0.07) * (r - 8), Math.sin(aa - 0.07) * (r - 8), x, y);
    }
    c.stroke();
  }

// ============================================================================
// Bakes every ART sprite into one texture atlas at load time.
// Sprite id == insertion order in ART, which is also what Rust was generated
// against -- see tools/gen_sprites.js.
//
// Packing matters here: a naive shelf packer wasted enough space to push the
// atlas to 4096x4096, which is ~85MB of GPU memory with mipmaps and sits right
// on iOS Safari's canvas area limit. MaxRects gets the same sprites into
// 2048x2048, a quarter of the memory, which every WebGL device can hold.
// ============================================================================

function buildAtlas(maxSize) {
  var names = Object.keys(ART);
  var PAD = 4;
  maxSize = maxSize || 4096;

      case 'disarm': tone(1046, t, 0.07, 'sine', 0.22); tone(1568, t + 0.06, 0.14, 'sine', 0.18); break;
      case 'stuck':  noise(t, 0.3, 0.2, 120, 500); break;
      case 'check':  tone(659, t, 0.1, 'sine', 0.2); tone(988, t + 0.08, 0.2, 'sine', 0.18); break;
      case 'stolen':
        // A chittering snatch, then the sound of it leaving.
        for (var k = 0; k < 6; k++) tone(900 - k * 60, t + k * 0.035, 0.06, 'square', 0.16);
        tone(330, t + 0.2, 0.3, 'sawtooth', 0.22, 120);
        noise(t, 0.18, 0.2, 400, 2200);
        break;
    }
  }

  function toggle() {
    muted = !muted;
    if (master && ctx) master.gain.setTargetAtTime(muted ? 0 : 0.9, ctx.currentTime, 0.05);
    return muted;
  }

  return { resume: resume, play: play, toggle: toggle, setMood: setMood, setTension: setTension,
           isMuted: function () { return muted; } };
})();

// ---------------------------------------------------------------------------
// Input
// ---------------------------------------------------------------------------

var IN = { LEFT: 1, RIGHT: 2, UP: 4, DOWN: 8, JUMP: 16, SNEAK: 32, ACTION: 64 };
var keys = {};
var touchBits = 0;

var KEYMAP = {
  ArrowLeft: IN.LEFT, KeyA: IN.LEFT,
  ArrowRight: IN.RIGHT, KeyD: IN.RIGHT,
  ArrowUp: IN.UP, KeyW: IN.UP,
  ArrowDown: IN.DOWN, KeyS: IN.DOWN,
  Space: IN.JUMP, KeyZ: IN.JUMP,
  ShiftLeft: IN.SNEAK, ShiftRight: IN.SNEAK,
  KeyE: IN.ACTION, KeyJ: IN.ACTION, KeyX: IN.ACTION
};

function inputBits() {
  var b = touchBits;
  for (var code in keys) if (keys[code] && KEYMAP[code]) b |= KEYMAP[code];
  // Up doubles as jump, the way old platformers did.
  if (b & IN.UP) b |= IN.JUMP;

  var pads = navigator.getGamepads ? navigator.getGamepads() : [];
  for (var i = 0; i < pads.length; i++) {
    var p = pads[i];
    if (!p) continue;
    var ax = p.axes[0] || 0;
    if (ax < -0.35) b |= IN.LEFT;
    if (ax > 0.35) b |= IN.RIGHT;
    if (p.axes[1] < -0.5) b |= IN.UP;
    if (p.axes[1] > 0.5) b |= IN.DOWN;
    if (p.buttons[12] && p.buttons[12].pressed) b |= IN.UP;
    if (p.buttons[13] && p.buttons[13].pressed) b |= IN.DOWN;
    if (p.buttons[14] && p.buttons[14].pressed) b |= IN.LEFT;
    if (p.buttons[15] && p.buttons[15].pressed) b |= IN.RIGHT;
    if (p.buttons[0] && p.buttons[0].pressed) b |= IN.JUMP;
    if (p.buttons[2] && p.buttons[2].pressed) b |= IN.ACTION;
    if (p.buttons[1] && p.buttons[1].pressed) b |= IN.ACTION;
    if ((p.buttons[6] && p.buttons[6].value > 0.4) || (p.buttons[10] && p.buttons[10].pressed)) b |= IN.SNEAK;
  }
  return b;
}

// ---------------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------------

function base64ToBytes(b64) {
  var bin = atob(b64);
  var out = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

var wasm = null, mem = null, memF32 = null;
var renderer = null, canvas = null;
var ui = {};
var state = { phase: -1, level: 0, unlocked: 0, levelCount: 5, paused: false, menu: 'title' };
var lastTime = 0, accum = 0;

function refreshViews() {
  if (!mem || mem.buffer !== memF32.buffer) memF32 = new Float32Array(mem.buffer);
}

function el(id) { return document.getElementById(id); }

function boot() {
  canvas = el('game');
  try {
    renderer = createRenderer(canvas);
  } catch (e) {
    showFatal('This browser could not start WebGL.<br><small>' + e.message + '</small>');
    return;
  }

  var bytes = base64ToBytes(WASM_B64);
  WebAssembly.instantiate(bytes, {}).then(function (res) {
    wasm = res.instance.exports;
    mem = wasm.memory;
    memF32 = new Float32Array(mem.buffer);
    wasm.wb_init((Math.random() * 0xffffffff) >>> 0);
    state.levelCount = wasm.wb_level_count();
    cacheUi();
    bindEvents();
    resize();
    showMenu('title');
    requestAnimationFrame(frame);
  }).catch(function (e) {
    showFatal('The game core failed to load.<br><small>' + e.message + '</small>');
  });
}

function showFatal(html) {
  var o = el('fatal');
  o.innerHTML = '<div class="card"><h2>Trouble in the backyard</h2><p>' + html + '</p></div>';
  o.style.display = 'flex';
}

function cacheUi() {
  ['hud', 'hearts', 'score', 'loot', 'lootMax', 'tensionFill', 'levelName', 'timer',
   'powerups', 'toast', 'menu', 'menuBody', 'progressFill', 'promptHint', 'crumbCount',
   'muteBtn', 'irBtn', 'touch', 'rotate'].forEach(function (id) { ui[id] = el(id); });
}

// A phone is anything with touch and no fine pointer; a laptop trackpad has
// touch events in some browsers, so check the pointer type too.
var isTouch = ('ontouchstart' in window || (navigator.maxTouchPoints || 0) > 0) &&
  !(window.matchMedia && window.matchMedia('(pointer: fine)').matches);

var portraitBlocked = false;

function resize() {
  // Phones are slower and the canvas cost scales with pixels, so cap harder.
  var maxDpr = isTouch ? 1.75 : 2;
  var dpr = Math.min(window.devicePixelRatio || 1, maxDpr);
  var w = window.innerWidth, h = window.innerHeight;
  canvas.width = Math.floor(w * dpr);
  canvas.height = Math.floor(h * dpr);
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  // A side-scroller in portrait shows almost nothing either side of the rat.
  portraitBlocked = isTouch && (w / h) < 1.05;
  ui.rotate.classList.toggle('show', portraitBlocked);
}

  }

  b.innerHTML = html;
  ui.menu.classList.add('show');

}

function hideMenu() {
  state.menu = null;
  ui.menu.classList.remove('show');
  ui.hud.classList.remove('dim');
}

var prevMenu = 'title';

function menuAction(act, node) {
  Audio_.resume();
  if (act === 'play') { startLevel(0); }
  else if (act === 'levels') { prevMenu = state.menu; showMenu('levels'); }
  else if (act === 'controls') { prevMenu = state.menu; showMenu('controls'); }
  else if (act === 'back') { showMenu(prevMenu === 'controls' ? 'title' : prevMenu); }
  else if (act === 'title') { wasm.wb_set_phase(PHASE.TITLE); wasm.wb_start_level(0); wasm.wb_set_phase(PHASE.TITLE); showMenu('title'); }
  else if (act === 'resume') { state.paused = false; hideMenu(); }
  else if (act === 'restart') { startLevel(state.level); }
  else if (act === 'next') { startLevel(state.level + 1); }
  else if (act === 'bug') { reportBug(); }
  else if (act === 'idea') { suggestIdea(); }
  else if (act === 'finish') { showMenu('finished', { total: lastStats.total, deaths: lastStats.deaths }); }
}

// Opens a pre-filled GitHub issue. The game details block is what lets
// tools/render.js put the rat back exactly where the report came from.
function reportBug() {
  if (!state.menu) { state.paused = true; showMenu('pause'); }
  refreshViews();
  var p = wasm.wb_state_ptr() >> 2;
  var s = memF32.subarray(p, p + 48);
  var level = s[6] | 0;
  var phaseName = Object.keys(PHASE).filter(function (k) { return PHASE[k] === (s[5] | 0); })[0];
  var details = [
    'build:    ' + BUILD_ID,
    'level:    ' + level + ' (' + LEVEL_NAMES[level] + ')',
    'phase:    ' + phaseName + ', ' + s[7].toFixed(1) + 's in',
    'position: x=' + Math.round(s[27]) + ' y=' + Math.round(s[28]),
    'velocity: x=' + Math.round(s[29]) + ' y=' + Math.round(s[30]) +
      (s[31] > 0.5 ? ', on ground' : ', airborne') + (s[33] > 0.5 ? ', crouched' : ''),
    'player:   state=' + (s[32] | 0) + ' health=' + (s[0] | 0) +
      ' loot=' + (s[2] | 0) + '/' + (s[3] | 0) + ' tension=' + s[4].toFixed(2),
    'vision:   ' + (irOn ? 'infrared' : 'normal') + (Audio_.isMuted() ? ', muted' : ''),
    'screen:   ' + window.innerWidth + 'x' + window.innerHeight + ' @' + (window.devicePixelRatio || 1) + 'x' +
      (isTouch ? ', touch' : ''),
    'browser:  ' + navigator.userAgent
  ].join('\n');
  var url = ISSUE_URL + '?template=bug.yml' +
    '&title=' + encodeURIComponent('[' + LEVEL_NAMES[level] + '] ') +
    '&context=' + encodeURIComponent(details);
  window.open(url, '_blank', 'noopener');
}

// Ideas don't need the player's physics state, just enough to say where
// the player was when it occurred to them.
function suggestIdea() {
  if (!state.menu) { state.paused = true; showMenu('pause'); }
  refreshViews();
  var p = wasm.wb_state_ptr() >> 2;
  var level = memF32[p + 6] | 0;
  var details = [
    'build:    ' + BUILD_ID,
    'level:    ' + level + ' (' + LEVEL_NAMES[level] + ')',
    'screen:   ' + window.innerWidth + 'x' + window.innerHeight + (isTouch ? ', touch' : ''),
    'browser:  ' + navigator.userAgent
  ].join('\n');
  var url = ISSUE_URL + '?template=feature.yml' +
    '&title=' + encodeURIComponent('Idea: ') +
    '&context=' + encodeURIComponent(details);
  window.open(url, '_blank', 'noopener');
}

function startLevel(i) {
  state.level = i;
  state.paused = false;
  wasm.wb_start_level(i);
  Audio_.setMood([0, 0, 0, 3, 2][i] !== undefined ? moodFor(i) : 0);
  hideMenu();
}

function moodFor(i) {
  // Matches Level::new in Rust: 0 afternoon, 1 dusk, 2 night, 3 underside.
  return [1, 0, 0, 3, 2, 2][i];
}

// ---------------------------------------------------------------------------
// Events
// ---------------------------------------------------------------------------

function bindEvents() {
  window.addEventListener('resize', resize);

  window.addEventListener('keydown', function (e) {
    Audio_.resume();
    if (e.code === 'Escape') {
      if (state.menu === 'pause') { state.paused = false; hideMenu(); }
      else if (!state.menu) { state.paused = true; showMenu('pause'); }
      e.preventDefault();
      return;
    }
    if (e.code === 'KeyM') { ui.muteBtn.textContent = Audio_.toggle() ? '♪ off' : '♪ on'; return; }
    if (e.code === 'KeyI') { toggleIR(); return; }
    if (e.code === 'KeyB') { reportBug(); return; }
    if (state.menu && (e.code === 'Enter' || e.code === 'Space')) {
      var btn = ui.menuBody.querySelector('button.primary') || ui.menuBody.querySelector('button');
      if (btn) { btn.click(); e.preventDefault(); return; }
    }
    if (KEYMAP[e.code]) { keys[e.code] = true; e.preventDefault(); }
  });

  window.addEventListener('keyup', function (e) {
    if (KEYMAP[e.code]) { keys[e.code] = false; e.preventDefault(); }
  });

  window.addEventListener('blur', function () { keys = {}; touchBits = 0; });

  ui.menu.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.level !== undefined) { startLevel(parseInt(b.dataset.level, 10)); return; }
    if (b.dataset.act) menuAction(b.dataset.act, b);
  });

  ui.irBtn.addEventListener('click', function () {
    Audio_.resume();
    toggleIR();
  });

  ui.muteBtn.addEventListener('click', function () {
    Audio_.resume();
    ui.muteBtn.textContent = Audio_.toggle() ? '♪ off' : '♪ on';
  });

  // Touch controls.
  var map = { left: IN.LEFT, right: IN.RIGHT, jump: IN.JUMP, sneak: IN.SNEAK, act: IN.ACTION, up: IN.UP, down: IN.DOWN };
  ui.touch.querySelectorAll('[data-btn]').forEach(function (b) {
    var bit = map[b.dataset.btn];
    var on = function (e) { e.preventDefault(); Audio_.resume(); touchBits |= bit; b.classList.add('down'); };
    var off = function (e) { e.preventDefault(); touchBits &= ~bit; b.classList.remove('down'); };
    b.addEventListener('touchstart', on, { passive: false });
    b.addEventListener('touchend', off, { passive: false });
    b.addEventListener('touchcancel', off, { passive: false });
    b.addEventListener('mousedown', on);
    b.addEventListener('mouseup', off);
    b.addEventListener('mouseleave', off);
  });
  if (isTouch) ui.touch.classList.add('show');
  window.addEventListener('orientationchange', function () {
    touchBits = 0;
    setTimeout(resize, 120);
  });
  // Stop iOS from scrolling/zooming the page out from under the canvas.
  document.addEventListener('touchmove', function (e) {
    if (e.touches.length > 1 || isTouch) e.preventDefault();
  }, { passive: false });
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
}

// ---------------------------------------------------------------------------
// HUD
// ---------------------------------------------------------------------------

var lastStats = { total: 0, deaths: 0 };
var irOn = false, irAvailable = false, irHintTimer = 0;

// Infrared is a night-vision aid: it only exists where it would be useful.
function toggleIR() {
  if (!irAvailable) return;
  irOn = !irOn;
  wasm.wb_set_vision(irOn ? 1 : 0);
  ui.irBtn.classList.toggle('on', irOn);
  ui.irBtn.textContent = irOn ? 'IR ON' : 'IR';
  ui.hud.classList.toggle('ir', irOn);
  Audio_.play(irOn ? 'check' : 'pickup');
}

var hudCache = { health: -1, score: -1, loot: -1, lootMax: -1, level: -1, crumbs: -1, pw: '' };

function updateHud(s) {
  var health = s[0] | 0, score = s[1] | 0, loot = s[2] | 0, lootMax = s[3] | 0;
  var tension = s[4], level = s[6] | 0, time = s[7], progress = s[8];
  var toastFood = s[12] | 0, toastT = s[13];
  var shield = s[14] > 0.5, boost = s[15], djump = s[16], prompt = s[17];
  var crumbs = s[18] | 0;
  var hedgeLocked = s[34] > 0.5, shortBy = s[35] | 0;
  var mood = s[36] | 0;

  // Night Run and Under the Hutch carry the thermal camera.
  var canIR = (mood === 2 || mood === 3);
  if (canIR !== irAvailable) {
    irAvailable = canIR;
    ui.irBtn.classList.toggle('hidden', !canIR);
    if (!canIR && irOn) { irOn = false; ui.hud.classList.remove('ir'); ui.irBtn.classList.remove('on'); }
    // The button is small and easy to miss, so announce it on arrival.
    if (canIR) {
      ui.toast.innerHTML = 'Thermal camera available &mdash; press <b>I</b>';
      ui.toast.style.background = '';
      ui.toast.style.opacity = 1;
      clearTimeout(irHintTimer);
      irHintTimer = setTimeout(function () { ui.toast.style.opacity = 0; }, 3200);
    }
  }
  if ((s[37] > 0.5) !== irOn) {
    irOn = s[37] > 0.5;
    ui.irBtn.classList.toggle('on', irOn);
    ui.irBtn.textContent = irOn ? 'IR ON' : 'IR';
    ui.hud.classList.toggle('ir', irOn);
  }

  if (health !== hudCache.health) {
    hudCache.health = health;
    var h = '';
    for (var i = 0; i < 3; i++) h += '<i class="' + (i < health ? 'on' : 'off') + '">\u2665</i>';
    ui.hearts.innerHTML = h;
  }
  if (score !== hudCache.score) { hudCache.score = score; ui.score.textContent = score.toLocaleString(); }
  if (crumbs !== hudCache.crumbs) { hudCache.crumbs = crumbs; ui.crumbCount.textContent = crumbs; }
  if (loot !== hudCache.loot || lootMax !== hudCache.lootMax) {
    hudCache.loot = loot; hudCache.lootMax = lootMax;
    ui.loot.textContent = loot;
    ui.lootMax.textContent = lootMax;
    ui.loot.parentElement.classList.toggle('done', loot >= lootMax);
  }
  if (level !== hudCache.level) {
    hudCache.level = level;
    ui.levelName.innerHTML = '<b>' + (level + 1) + '.</b> ' + LEVEL_NAMES[level];
  }

  ui.tensionFill.style.transform = 'scaleX(' + Math.max(0.001, tension) + ')';
  ui.tensionFill.classList.toggle('hot', tension > 0.75);
  ui.progressFill.style.transform = 'scaleX(' + Math.max(0.001, progress) + ')';
  ui.timer.textContent = time.toFixed(1) + 's';

  var pw = '';
  if (shield) pw += '<i class="pw shield" title="Marshmallow shield">●</i>';
  if (boost > 0) pw += '<i class="pw boost" title="Bacon speed">»</i>';
  if (djump > 0) pw += '<i class="pw jump" title="Double jump">↑</i>';
  if (pw !== hudCache.pw) { hudCache.pw = pw; ui.powerups.innerHTML = pw; }

  if (toastT > 0 && toastFood === -2) {
    ui.toast.textContent = 'A raccoon took it!';
    ui.toast.style.background = '#8c2f24';
    ui.toast.style.opacity = Math.min(1, toastT);
  } else if (toastT > 0 && toastFood >= 0) {
    ui.toast.textContent = 'Got the ' + FOOD_NAMES[toastFood];
    ui.toast.style.background = '';
    ui.toast.style.opacity = Math.min(1, toastT);
  } else {
    ui.toast.style.opacity = 0;
  }

  // The bait prompt wins; otherwise explain a hedge that will not open.
  if (prompt > 0) {
    ui.promptHint.innerHTML = 'Crouch and press <kbd>E</kbd> to lift the bait';
    ui.promptHint.style.opacity = 1;
  } else if (hedgeLocked) {
    ui.promptHint.innerHTML = 'The hedge is no use empty-handed &mdash; find <b>' + shortBy +
      '</b> more piece' + (shortBy === 1 ? '' : 's') + ' of food first';
    ui.promptHint.style.opacity = 1;
  } else {
    ui.promptHint.style.opacity = 0;
  }
}

// ---------------------------------------------------------------------------
// Frame
// ---------------------------------------------------------------------------

function handleEvents(bits) {
  if (bits & EV.JUMP) Audio_.play('jump');
  if (bits & EV.LAND) Audio_.play('land');
  if (bits & EV.STEP) Audio_.play('step');
  if (bits & EV.PICKUP) Audio_.play('pickup');
  if (bits & EV.LOOT) Audio_.play('loot');
  if (bits & EV.SNAP) Audio_.play('snap');
  if (bits & EV.ZAP) Audio_.play('zap');
  if (bits & EV.HURT) Audio_.play('hurt');
  if (bits & EV.ALERT) Audio_.play('alert');
  if (bits & EV.BARK) Audio_.play('bark');
  if (bits & EV.CAUGHT) Audio_.play('caught');
  if (bits & EV.SAFE) Audio_.play('safe');
  if (bits & EV.DISARM) Audio_.play('disarm');
  if (bits & EV.STUCK) Audio_.play('stuck');
  if (bits & EV.CHECKPOINT) Audio_.play('check');
  if (bits & EV.STOLEN) Audio_.play('stolen');
}

function frame(now) {
  requestAnimationFrame(frame);
  var dt = lastTime ? (now - lastTime) / 1000 : 0.016;
  lastTime = now;
  if (dt > 0.25) dt = 0.25;

  var input = (state.menu || state.paused || portraitBlocked) ? 0 : inputBits();

  // 1080 units tall by default, but never so narrow that the rat cannot see
  // what is coming -- squat windows zoom out instead of cropping.
  var aspect = canvas.width / Math.max(1, canvas.height);
  var vh = 1080;
  if (vh * aspect < 1500) vh = Math.min(2100, 1500 / aspect);
  var vw = vh * aspect;

  wasm.wb_tick((state.paused && state.menu) || portraitBlocked ? 0 : dt, input, vw, vh);
  refreshViews();

  handleEvents(wasm.wb_take_events());

  var sPtr = wasm.wb_state_ptr() >> 2;
  var s = memF32.subarray(sPtr, sPtr + 48);

  var phase = s[5] | 0;
  state.unlocked = s[23] | 0;
  lastStats.total = s[20] | 0;
  lastStats.deaths = s[19] | 0;

  // Phase transitions that need a menu.
  if (phase !== state.phase) {
    state.phase = phase;
    if (phase === PHASE.COMPLETE) {
      setTimeout(function () {
        if (state.phase === PHASE.COMPLETE) {
          showMenu('complete', {
            level: s[6] | 0, score: s[1] | 0, crumbs: s[18] | 0,
            time: s[7], health: s[0] | 0
          });
        }
      }, 1500);
    } else if (phase === PHASE.GAMEOVER) {
      setTimeout(function () {
        if (state.phase === PHASE.GAMEOVER) showMenu('gameover');
      }, 700);
    }
  }

  Audio_.setTension(s[4]);
  if (!state.menu) updateHud(s);

  var dPtr = wasm.wb_draw_ptr() >> 2;
  var count = wasm.wb_draw_count();
  var cmds = memF32.subarray(dPtr, dPtr + count * CMD_STRIDE);
  renderer.render(cmds, count, vw, vh, [s[9], s[10], s[11]]);
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

</script>
<script>
  // Hide the boot curtain once the first frame has actually been drawn.
  requestAnimationFrame(function () {
    requestAnimationFrame(function () {
      setTimeout(function () { document.getElementById('boot').classList.add('gone'); }, 120);
    });
  });
</script>
